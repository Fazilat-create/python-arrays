<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Панель учителя · Массивы в Python</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --lavender: #b8a8e8;
    --mint: #a8e6cf;
    --rose: #ff8a95;
    --ink: #5a4a8a;
    --ink-soft: #8a7ab0;
    --line: #ece4ff;
  }
  html, body {
    height: 100%;
    font-family: 'Comfortaa', 'Segoe UI', 'Verdana', sans-serif;
    background: linear-gradient(135deg, #fef6ff 0%, #e8f4fd 50%, #fff5e6 100%);
    color: var(--ink);
    overflow: hidden;
  }
  body::before, body::after {
    content: ""; position: fixed; border-radius: 50%;
    filter: blur(60px); opacity: 0.35; pointer-events: none; z-index: 0;
  }
  body::before { width: 400px; height: 400px; background: #d5b3ff; top: -100px; left: -100px; }
  body::after  { width: 500px; height: 500px; background: #ffd0e0; bottom: -150px; right: -150px; }

  /* ==========================================================
     ЭКРАН ВХОДА ПО ПАРОЛЮ
     ========================================================== */
  .login-screen {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    z-index: 1000; padding: 20px;
    background: linear-gradient(135deg, rgba(254,246,255,0.95), rgba(232,244,253,0.95));
    backdrop-filter: blur(8px);
  }
  .login-screen.hidden { display: none; }

  .login-card {
    background: #fff;
    border-radius: 24px;
    padding: 40px 44px;
    max-width: 440px;
    width: 100%;
    text-align: center;
    box-shadow: 0 25px 70px rgba(180,150,220,0.3);
    border: 2px solid #f0eaff;
    animation: modalIn 0.5s cubic-bezier(0.22, 1, 0.36, 1);
    position: relative;
    z-index: 1;
  }
  @keyframes modalIn {
    from { opacity: 0; transform: translateY(20px) scale(0.95); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
  .login-card .lock-icon {
    font-size: 3em; margin-bottom: 14px;
    animation: float 3s ease-in-out infinite;
    display: inline-block;
  }
  @keyframes float {
    0%,100% { transform: translateY(0) rotate(-3deg); }
    50% { transform: translateY(-8px) rotate(3deg); }
  }
  .login-card h2 {
    font-size: 1.5em; margin-bottom: 8px;
    background: linear-gradient(135deg, #b8a8e8, #ff8a95);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .login-card p {
    color: var(--ink-soft); margin-bottom: 22px;
    font-size: 0.95em; line-height: 1.5;
  }
  .login-card input {
    width: 100%; padding: 14px 18px;
    border: 2px solid #ece4ff; border-radius: 14px;
    font-family: inherit; font-size: 1em;
    text-align: center; color: var(--ink); outline: none;
    transition: 0.25s; background: #fdfbff;
    letter-spacing: 2px;
  }
  .login-card input:focus {
    border-color: #b8a8e8;
    box-shadow: 0 0 0 4px rgba(184,168,232,0.15);
  }
  .login-card input.error {
    border-color: #ff8a95;
    box-shadow: 0 0 0 4px rgba(255,138,149,0.15);
    animation: shake 0.4s ease;
  }
  @keyframes shake {
    0%,100% { transform: translateX(0); }
    25% { transform: translateX(-8px); }
    75% { transform: translateX(8px); }
  }
  .login-card .login-btn {
    margin-top: 18px; width: 100%;
    padding: 14px; background: linear-gradient(135deg, #b8a8e8, #ff8a95);
    color: #fff; border: none; border-radius: 14px;
    font-family: inherit; font-size: 1.05em; font-weight: 700;
    cursor: pointer; transition: 0.25s;
    box-shadow: 0 8px 20px rgba(184,168,232,0.4);
  }
  .login-card .login-btn:hover:not(:disabled) {
    transform: translateY(-2px);
    box-shadow: 0 12px 28px rgba(184,168,232,0.55);
  }
  .login-card .login-btn:disabled {
    background: #e0d8f0; cursor: not-allowed; box-shadow: none;
  }
  .login-card .error-text {
    margin-top: 12px;
    color: #c04a4a; font-size: 0.88em; font-weight: 600;
    min-height: 20px;
  }
  .login-card .back-link {
    display: inline-block;
    margin-top: 18px; font-size: 0.85em;
    color: var(--ink-soft); text-decoration: none;
    font-weight: 600;
  }
  .login-card .back-link:hover { color: var(--ink); }
  .login-card .hint-pass {
    margin-top: 14px; font-size: 0.78em;
    color: #a99cd0; font-style: italic;
  }

  /* ==========================================================
     ВЕРХНЯЯ ПАНЕЛЬ УЧИТЕЛЯ
     ========================================================== */
  .teacher-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 24px;
    background: linear-gradient(135deg, #d9c8ff 0%, #ffd6e8 50%, #c8ecff 100%);
    border-bottom: 1px solid rgba(180,150,220,0.3);
    flex-wrap: wrap; gap: 12px;
    box-shadow: 0 2px 12px rgba(180,150,220,0.15);
    position: relative;
    z-index: 10;
  }
  .teacher-header .brand {
    display: flex; align-items: center; gap: 12px;
    font-weight: 700; color: var(--ink);
  }
  .teacher-header .brand .icon {
    font-size: 1.6em;
    animation: float 3s ease-in-out infinite;
    display: inline-block;
  }
  .teacher-header .brand h1 { font-size: 1.05em; line-height: 1.2; }
  .teacher-header .brand .sub {
    font-size: 0.75em; color: var(--ink-soft);
    font-weight: 400; margin-top: 2px;
  }

  .teacher-header .controls {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  }

  .lesson-switch {
    display: flex; background: #fff; border-radius: 12px; padding: 4px;
    box-shadow: 0 4px 12px rgba(180,150,220,0.15);
  }
  .lesson-switch button {
    background: none; border: none; padding: 8px 18px;
    font-family: inherit; font-size: 0.88em; font-weight: 600;
    color: var(--ink-soft); cursor: pointer; border-radius: 9px;
    transition: 0.25s;
  }
  .lesson-switch button:hover { color: var(--ink); }
  .lesson-switch button.active {
    background: linear-gradient(135deg, #b8a8e8, #ff8a95);
    color: #fff;
    box-shadow: 0 4px 10px rgba(184,168,232,0.4);
  }

  .timer {
    display: flex; align-items: center; gap: 8px;
    background: #fff; padding: 6px 14px; border-radius: 12px;
    box-shadow: 0 4px 12px rgba(180,150,220,0.15);
    font-weight: 700; color: var(--ink);
    font-variant-numeric: tabular-nums;
    font-size: 0.95em;
  }
  .timer .icon { font-size: 1.1em; }
  .timer.warning #timerDisplay { color: #c04a4a; }
  .timer.danger { animation: pulse-timer 1s ease-in-out infinite; }
  @keyframes pulse-timer {
    0%,100% { box-shadow: 0 4px 12px rgba(255,138,149,0.3); }
    50% { box-shadow: 0 4px 20px rgba(255,138,149,0.7); }
  }
  .timer button {
    background: none; border: none; font-family: inherit;
    font-size: 0.78em; font-weight: 600; color: var(--ink-soft);
    cursor: pointer; padding: 4px 10px; border-radius: 8px;
    transition: 0.2s;
  }
  .timer button:hover { background: #faf6ff; color: var(--ink); }

  .student-link {
    text-decoration: none; padding: 8px 16px;
    background: #fff; color: #7a5aa8;
    border-radius: 12px; font-size: 0.85em; font-weight: 600;
    box-shadow: 0 4px 12px rgba(180,150,220,0.15);
    transition: 0.25s;
  }
  .student-link:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 18px rgba(180,150,220,0.3);
  }

  .home-link {
    text-decoration: none; padding: 8px 14px;
    background: rgba(255,255,255,0.8); color: #7a5aa8;
    border-radius: 12px; font-size: 0.85em; font-weight: 600;
    transition: 0.25s;
  }
  .home-link:hover { background: #fff; transform: translateY(-2px); }

  /* ============ КНОПКА СБРОСА ============ */
  .reset-btn {
    background: linear-gradient(135deg, #ffe8b0, #ffd966);
    border: none; padding: 8px 16px;
    border-radius: 12px; font-family: inherit;
    font-size: 0.85em; font-weight: 700;
    color: #7a4a00; cursor: pointer;
    transition: 0.25s;
    box-shadow: 0 4px 12px rgba(255,184,77,0.3);
    display: flex; align-items: center; gap: 6px;
  }
  .reset-btn:hover {
    background: linear-gradient(135deg, #ffd966, #ffb84d);
    transform: translateY(-2px);
    box-shadow: 0 8px 18px rgba(255,184,77,0.5);
  }
  .reset-btn:active { transform: translateY(0); }

  .logout-btn {
    background: rgba(255,255,255,0.9);
    border: none; padding: 8px 14px;
    border-radius: 12px; font-family: inherit;
    font-size: 0.85em; font-weight: 600;
    color: #c04a4a; cursor: pointer;
    transition: 0.25s;
  }
  .logout-btn:hover {
    background: #fff;
    transform: translateY(-2px);
    box-shadow: 0 8px 18px rgba(255,138,149,0.3);
  }

  .lesson-frame {
    width: 100%;
    height: calc(100vh - 76px);
    border: none;
    background: #fff;
    display: block;
    position: relative;
    z-index: 1;
  }

  /* ==========================================================
     ВСПЛЫВАЮЩЕЕ УВЕДОМЛЕНИЕ
     ========================================================== */
  .toast {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%) translateY(100px);
    background: linear-gradient(135deg, #a8e6cf, #7ed9b8);
    color: #2a6a4a;
    padding: 14px 26px;
    border-radius: 16px;
    font-weight: 700;
    font-size: 0.95em;
    box-shadow: 0 12px 30px rgba(126,217,184,0.4);
    transition: transform 0.4s cubic-bezier(0.22, 1, 0.36, 1);
    z-index: 2000;
    pointer-events: none;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }

  @media (max-width: 1100px) {
    .teacher-header .brand h1 { font-size: 0.95em; }
    .reset-btn { padding: 6px 12px; font-size: 0.78em; }
  }

  @media (max-width: 900px) {
    .teacher-header { padding: 10px 14px; }
    .lesson-switch button { padding: 6px 12px; font-size: 0.8em; }
    .timer { padding: 5px 10px; font-size: 0.85em; }
    .student-link, .home-link, .logout-btn { padding: 6px 10px; font-size: 0.78em; }
    .lesson-frame { height: calc(100vh - 66px); }
  }
</style>
</head>
<body>

<!-- ==========================================================
     ЭКРАН ВХОДА ПО ПАРОЛЮ
     ========================================================== -->
<div class="login-screen" id="loginScreen">
  <div class="login-card">
    <div class="lock-icon">🔐</div>
    <h2>Вход для учителя</h2>
    <p>Эта панель доступна только учителю.<br>Введите пароль, чтобы продолжить.</p>
    <input type="password" id="passwordInput" placeholder="Пароль" maxlength="40" autocomplete="off">
    <button class="login-btn" id="loginBtn" disabled onclick="tryLogin()">Войти</button>
    <div class="error-text" id="errorText"></div>
    <a href="index.html" class="back-link">← Вернуться на главную</a>
    <div class="hint-pass">По умолчанию: <b>teacher2024</b></div>
  </div>
</div>

<!-- ==========================================================
     ПАНЕЛЬ УЧИТЕЛЯ
     ========================================================== -->
<div id="teacherPanel" style="display: none;">
  <div class="teacher-header">
    <div class="brand">
      <div class="icon">👩‍🏫</div>
      <div>
        <h1>Панель учителя · Массивы в Python</h1>
        <div class="sub">Показ уроков · таймер · сброс прогресса</div>
      </div>
    </div>

    <div class="controls">
      <a href="index.html" class="home-link">← На главную</a>

      <div class="lesson-switch">
        <button class="active" onclick="switchLesson(1, this)">Урок 1</button>
        <button onclick="switchLesson(2, this)">Урок 2</button>
      </div>

      <div class="timer" id="timerBox">
        <span class="icon">⏱</span>
        <span id="timerDisplay">45:00</span>
        <button id="timerBtn" onclick="toggleTimer()">Старт</button>
        <button onclick="resetTimer()">Сброс</button>
      </div>

      <a href="urok1.html" target="_blank" class="student-link" id="studentLink">
        Открыть версию ученика ↗
      </a>

      <button class="reset-btn" onclick="askResetProgress()" title="Очистить имя, цветочки и выполненные задания в этом браузере">
        🧹 Сбросить прогресс
      </button>

      <button class="logout-btn" onclick="logout()">Выйти</button>
    </div>
  </div>

  <iframe id="lessonFrame" src="urok1.html" class="lesson-frame" title="Урок"></iframe>
</div>

<!-- Всплывающее уведомление -->
<div class="toast" id="toast">Прогресс сброшен 🌸</div>

<script>
/* ==========================================================
   ПАРОЛЬ
   ========================================================== */
const TEACHER_PASSWORD = 'teacher2024';   // ← поменяйте на свой
const AUTH_KEY = 'teacher_auth';

/* ==========================================================
   ВХОД / ВЫХОД
   ========================================================== */
function checkAuth() {
  try { return localStorage.getItem(AUTH_KEY) === 'ok'; }
  catch(e) { return false; }
}

function showTeacherPanel() {
  document.getElementById('loginScreen').classList.add('hidden');
  document.getElementById('teacherPanel').style.display = 'block';
  updateTimer();
}

function showLoginScreen() {
  document.getElementById('loginScreen').classList.remove('hidden');
  document.getElementById('teacherPanel').style.display = 'none';
  document.getElementById('passwordInput').value = '';
  document.getElementById('loginBtn').disabled = true;
  document.getElementById('errorText').textContent = '';
  setTimeout(() => document.getElementById('passwordInput').focus(), 200);
}

function tryLogin() {
  const input = document.getElementById('passwordInput');
  const errorEl = document.getElementById('errorText');
  const btn = document.getElementById('loginBtn');
  const value = input.value;

  if (value === TEACHER_PASSWORD) {
    try { localStorage.setItem(AUTH_KEY, 'ok'); } catch(e) {}
    errorEl.textContent = '';
    showTeacherPanel();
  } else {
    input.classList.add('error');
    errorEl.textContent = 'Неверный пароль. Попробуйте ещё раз.';
    input.value = '';
    btn.disabled = true;
    setTimeout(() => input.classList.remove('error'), 500);
    setTimeout(() => input.focus(), 100);
  }
}

function logout() {
  try { localStorage.removeItem(AUTH_KEY); } catch(e) {}
  showLoginScreen();
}

document.getElementById('passwordInput').addEventListener('input', e => {
  document.getElementById('loginBtn').disabled = !e.target.value;
  document.getElementById('errorText').textContent = '';
});
document.getElementById('passwordInput').addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.value) tryLogin();
});

/* ==========================================================
   ПРИ ЗАГРУЗКЕ
   ========================================================== */
if (checkAuth()) {
  showTeacherPanel();
} else {
  showLoginScreen();
}

/* ==========================================================
   ПЕРЕКЛЮЧЕНИЕ УРОКОВ
   ========================================================== */
function switchLesson(n, btn) {
  document.querySelectorAll('.lesson-switch button').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  const frame = document.getElementById('lessonFrame');
  frame.src = n === 1 ? 'urok1.html' : 'urok2.html';
  document.getElementById('studentLink').href = n === 1 ? 'urok1.html' : 'urok2.html';
}

/* ==========================================================
   ТАЙМЕР
   ========================================================== */
const LESSON_DURATION = 45 * 60;
let timerSeconds = LESSON_DURATION;
let timerInterval = null;

function updateTimer() {
  const m = String(Math.floor(timerSeconds / 60)).padStart(2, '0');
  const s = String(timerSeconds % 60).padStart(2, '0');
  document.getElementById('timerDisplay').textContent = `${m}:${s}`;

  const box = document.getElementById('timerBox');
  box.classList.toggle('warning', timerSeconds <= 300 && timerSeconds > 60);
  box.classList.toggle('danger', timerSeconds <= 60);
}

function toggleTimer() {
  const btn = document.getElementById('timerBtn');
  if (timerInterval) {
    clearInterval(timerInterval);
    timerInterval = null;
    btn.textContent = 'Продолжить';
  } else {
    timerInterval = setInterval(() => {
      if (timerSeconds <= 0) {
        clearInterval(timerInterval);
        timerInterval = null;
        btn.textContent = 'Готово';
        document.getElementById('timerDisplay').textContent = '00:00';
        return;
      }
      timerSeconds--;
      updateTimer();
    }, 1000);
    btn.textContent = 'Пауза';
  }
}

function resetTimer() {
  clearInterval(timerInterval);
  timerInterval = null;
  timerSeconds = LESSON_DURATION;
  document.getElementById('timerBtn').textContent = 'Старт';
  updateTimer();
}

/* ==========================================================
   СБРОС ПРОГРЕССА
   ========================================================== */
function askResetProgress() {
  const ok = confirm(
    '🧹 Сбросить прогресс?\n\n' +
    'Это очистит в ЭТОМ браузере:\n' +
    '• имя ученицы\n' +
    '• собранные цветочки\n' +
    '• отметки о выполненных заданиях\n\n' +
    'Учеников это НЕ затронет — у них свои браузеры.\n\n' +
    'Продолжить?'
  );
  if (!ok) return;
  doResetProgress();
}

function doResetProgress() {
  // 1. Удаляем прогресс учениц
  try {
    localStorage.removeItem('python_arrays_progress');
  } catch(e) {}

  // 2. Перезагружаем iframe — урок откроется с чистого листа
  const frame = document.getElementById('lessonFrame');
  const currentSrc = frame.src;
  // Обнуляем, потом ставим заново — так гарантированно перезагрузится
  frame.src = 'about:blank';
  setTimeout(() => { frame.src = currentSrc; }, 50);

  // 3. Показываем всплывающее уведомление
  showToast('Прогресс сброшен 🌸');

  // 4. Сбрасываем таймер на всякий случай
  resetTimer();
}

/* ==========================================================
   ВСПЛЫВАЮЩЕЕ УВЕДОМЛЕНИЕ
   ========================================================== */
let toastTimeout = null;
function showToast(text) {
  const toast = document.getElementById('toast');
  toast.textContent = text;
  toast.classList.add('show');
  if (toastTimeout) clearTimeout(toastTimeout);
  toastTimeout = setTimeout(() => {
    toast.classList.remove('show');
    toastTimeout = null;
  }, 2500);
}

/* ==========================================================
   ГОРЯЧИЕ КЛАВИШИ
   ========================================================== */
document.addEventListener('keydown', e => {
  // не работаем, пока открыт экран входа
  if (!document.getElementById('loginScreen').classList.contains('hidden')) return;

  if ((e.ctrlKey || e.metaKey) && e.key === '1') {
    e.preventDefault();
    switchLesson(1, document.querySelectorAll('.lesson-switch button')[0]);
  }
  if ((e.ctrlKey || e.metaKey) && e.key === '2') {
    e.preventDefault();
    switchLesson(2, document.querySelectorAll('.lesson-switch button')[1]);
  }
  if ((e.ctrlKey || e.metaKey) && e.key === 'r') {
    // Ctrl+R — только сброс таймера, чтобы не перезагружать страницу
    e.preventDefault();
    resetTimer();
  }
  if (e.code === 'Space' && e.target.tagName !== 'INPUT' && e.target.tagName !== 'TEXTAREA') {
    e.preventDefault();
    toggleTimer();
  }
});
</script>

</body>
</html>
